<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Staff Area</title>
<style>
:root{--bg:#faf9f6;--line:#e2dfd8;--tx:#1f1e1c;--mu:#6e6b64;--ac:#3d2fa0;--on:#fff;--er:#b3261e;--inp:#fff;--hov:#f0eee8;--sub:#3a3834}
:root[data-theme=dark]{--bg:#141416;--line:#2e2e33;--tx:#e9e7e2;--mu:#98958d;--ac:#a79bff;--on:#141416;--er:#ff8a80;--inp:#1b1b1e;--hov:#222226;--sub:#cdcac3}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.7 'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;min-height:100vh}
button,input,select,textarea{font:inherit;color:var(--tx)}
button,input,select,#top,aside,.bar,.hint,.err,.sub-t,dialog h3,.tagline{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
input,select,textarea{background:var(--inp);border:1px solid var(--line);border-radius:2px;padding:9px 11px;width:100%;font-size:.95rem}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button{background:var(--ac);color:var(--on);border:1px solid var(--ac);border-radius:2px;padding:9px 18px;font-size:.92rem;cursor:pointer}
button:hover{opacity:.88}
button.ghost{background:transparent;color:var(--tx);border-color:var(--line)}
button.ghost:hover{background:var(--hov);opacity:1}
.gate{min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:min(340px,100%);display:grid;gap:12px}
.card h1{margin:0;font-size:2.3rem;font-weight:400;line-height:1.1}
.sub-t{margin:0 0 8px;padding-bottom:16px;border-bottom:1px solid var(--line);color:var(--mu);font-size:.9rem}
.err{color:var(--er);min-height:1.2em;margin:0;font-size:.85rem}
#mg{position:fixed;right:20px;bottom:16px;color:var(--mu);font:.8rem system-ui,sans-serif;text-decoration:none}
#mg:hover{color:var(--tx);text-decoration:underline}
dialog{background:var(--bg);border:1px solid var(--line);border-radius:2px;padding:24px;width:min(340px,92vw);color:var(--tx)}
dialog::backdrop{background:#0008}
dialog h3{margin:0 0 4px;font-size:1rem;font-weight:600}
.dlg{display:grid;gap:12px}
.row{display:flex;gap:8px;justify-content:flex-end}
#top{position:fixed;top:14px;right:18px;z-index:20;display:flex;gap:6px}
#top button{background:var(--bg);color:var(--mu);border:1px solid var(--line);padding:6px 12px;font-size:.8rem}
#top button:hover{color:var(--tx);background:var(--hov);opacity:1}
#top [hidden]{display:none}
.wrap{display:grid;grid-template-columns:230px minmax(0,1fr);gap:64px;max-width:1040px;margin:0 auto;padding:72px 28px 110px}
aside{position:sticky;top:72px;align-self:start;max-height:calc(100vh - 100px);overflow:auto;font-size:.85rem;line-height:1.4;border-left:1px solid var(--line);padding-left:16px}
aside .lbl{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin-bottom:6px}
aside a{display:block;color:var(--mu);text-decoration:none;padding:3px 0}
aside a:hover,aside a.on{color:var(--ac)}
aside .t1{margin-top:14px;font-weight:600;color:var(--tx)}
aside .t1.on{color:var(--ac)}
aside .t2{padding-left:10px}
aside .lock{margin-top:22px;font-size:.8rem}
.doc{max-width:68ch}
.doc h1,.doc h2,.doc h3{scroll-margin-top:72px}
.doc h1{font-size:1.9rem;font-weight:400;line-height:1.2;margin:2.6em 0 .5em;padding-top:.9em;border-top:1px solid var(--line)}
.doc h1.title{font-size:2.6rem;margin:0;padding:0;border:0}
.tagline{color:var(--mu);margin:.3em 0 2.2em;font-size:.95rem}
.doc h2{font-size:1.4rem;font-weight:600;line-height:1.3;margin:2.2em 0 .3em}
.doc h3{font:600 .95rem/1.4 system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ac);margin:1.8em 0 .5em}
.doc p{margin:.6em 0}
.it{display:grid;grid-template-columns:2.2em minmax(0,1fr);margin:.55em 0}
.it>span,.sub>span{color:var(--mu);font-variant-numeric:tabular-nums}
.sub{display:grid;grid-template-columns:1.8em minmax(0,1fr);margin:.3em 0 .3em 2.2em;color:var(--sub);font-size:.97rem}
.note{border-left:2px solid var(--ac);padding:2px 0 2px 16px;color:var(--sub);font-size:.95rem;margin:0 0 1em}
.bar{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 20px;padding-right:130px;background:var(--bg);border-bottom:1px solid var(--line)}
.bar nav{display:flex;gap:6px;margin:0 auto 0 14px}
.bar nav button:not(.on){background:transparent;color:var(--tx);border-color:var(--line)}
#st{color:var(--mu);font-size:.82rem}
#pane{max-width:1300px;margin:0 auto;padding:20px}
.ed{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.ed textarea{height:75vh;resize:vertical;font:13px/1.55 ui-monospace,Menlo,Consolas,monospace}
.pv{max-width:none;height:75vh;overflow:auto;border:1px solid var(--line);padding:8px 26px 20px;font-size:15px}
.pv h1.title{display:none}
.gh{display:grid;gap:12px;max-width:520px;margin:16px 0}.gh label{display:grid;gap:4px;font:.85rem system-ui,sans-serif}
.hint{color:var(--mu);font-size:.82rem}
.row2{display:grid;grid-template-columns:1fr 1.3fr 170px auto;gap:8px;margin-bottom:8px}
@media(max-width:800px){body{font-size:16px}.wrap,.ed{grid-template-columns:1fr}.wrap{gap:28px;padding:64px 18px 80px}aside{position:static;max-height:none;border:0;padding:0}.row2{grid-template-columns:1fr 1fr}}
</style>
</head>

<script>
//LIB-START
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function kdf(pw,salt){
  const m=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function seal(key,obj){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(obj)));
  return {iv:b64(iv),ct:b64(ct)};
}
async function open(key,o){
  return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(o.iv)},key,ub(o.ct))));
}
async function build(doc,pws,gh){
  const gk=()=>crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt']);
  const dk=await gk(),mk=await gk();
  const dr=b64(await crypto.subtle.exportKey('raw',dk)),mr=b64(await crypto.subtle.exportKey('raw',mk));
  const data=await seal(dk,{doc}),adm=await seal(mk,{pws,gh:gh||{}});
  const slots=[];
  for(const p of pws){
    const salt=crypto.getRandomValues(new Uint8Array(16));
    const pl={k:dr,r:p.role};if(p.role==='mgmt')pl.m=mr;
    const s=await seal(await kdf(p.pw,salt),pl);
    slots.push({salt:b64(salt),iv:s.iv,ct:s.ct});
  }
  return {slots,data,adm};
}
async function unlock(V,pw){
  const imp=k=>crypto.subtle.importKey('raw',ub(k),'AES-GCM',false,['decrypt']);
  for(const sl of V.slots){
    try{
      const {k,r,m}=await open(await kdf(pw,ub(sl.salt)),sl);
      const d=await open(await imp(k),V.data);
      let a={pws:[],gh:{}};
      if(r==='mgmt'&&m)a=await open(await imp(m),V.adm);
      return {role:r,doc:d.doc,pws:a.pws,gh:a.gh||{}};
    }catch(e){}
  }
  return null;
}
//LIB-END

const $=s=>document.querySelector(s);
const app=$('#app');
const V=JSON.parse($('#vault').textContent);
let S=null,dirty=false;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function md(t){
  let h='',toc='';
  const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  t.split('\n').forEach((l,i)=>{
    if(!l.trim())return;
    let m=l.match(/^(#{1,3}) (.*)/);
    if(m){const n=m[1].length;h+=`<h${n} id="s${i}">${inl(m[2])}</h${n}>`;if(n<3)toc+=`<a class="t${n}" href="#s${i}">${inl(m[2])}</a>`;}
    else if(l.startsWith('> '))h+=`<div class="note">${inl(l.slice(2))}</div>`;
    else if(m=l.match(/^(\d+\)) (.*)/))h+=`<div class="it"><span>${m[1]}</span><div>${inl(m[2])}</div></div>`;
    else if(m=l.match(/^\s+([a-z]\)) (.*)/))h+=`<div class="sub"><span>${m[1]}</span><div>${inl(m[2])}</div></div>`;
    else if(/^\s+\S/.test(l))h+=`<div class="sub"><span></span><div>${inl(l.trim())}</div></div>`;
    else h+=`<p>${inl(l)}</p>`;
  });
  return {html:h,toc};
}

function gate(){
  S=null;$('#toc').hidden=true;
  app.innerHTML=`<div class="gate"><div class="card"><h1>Kubblo</h1><p class="sub-t">Staff Information and Guidelines</p>
  <input id="pw" type="password" placeholder="Staff password" autocomplete="off"><button type="button" id="go">Unlock</button><p class="err" id="e"></p></div>
  <a href="#" id="mg">Management?</a></div>
  <dialog id="dg"><div class="dlg"><h3>Management access</h3><input id="mc" type="password" placeholder="Access code" autocomplete="off">
  <p class="err" id="e2"></p><div class="row"><button type="button" class="ghost" id="cx">Cancel</button><button type="button" id="go2">Enter</button></div></div></dialog>`;
  const attempt=async(inp,err,ok)=>{
    if(!(window.crypto&&crypto.subtle)){err.textContent='Decryption is unavailable here. Open the file locally or host it over HTTPS.';return;}
    err.textContent='Checking…';
    try{ok(await unlock(V,inp.value));}catch(x){err.textContent='Error: '+x.message;}
  };
  $('#go').onclick=()=>attempt($('#pw'),$('#e'),r=>{if(r){S=r;view();}else $('#e').textContent='Incorrect password.';});
  $('#pw').onkeydown=e=>{if(e.key==='Enter')$('#go').click();};
  $('#go2').onclick=()=>attempt($('#mc'),$('#e2'),r=>{if(r&&r.role==='mgmt'){$('#dg').close();S=r;editor();}else $('#e2').textContent='Access denied.';});
  $('#mc').onkeydown=e=>{if(e.key==='Enter')$('#go2').click();};
  $('#mg').onclick=e=>{e.preventDefault();$('#mc').value='';$('#e2').textContent='';$('#dg').showModal();$('#mc').focus();};
  $('#cx').onclick=()=>$('#dg').close();
  $('#pw').focus();
}

function view(){
  const {html,toc}=md(S.doc);
  app.innerHTML=`<div class="wrap"><aside><div class="lbl">Contents</div>${toc}<a href="#" id="lo" class="lock">Lock</a></aside><main class="doc"><h1 class="title">Kubblo</h1><div class="tagline">Staff Information and Guidelines</div>${html}</main></div>`;
  const links=new Map([...document.querySelectorAll('aside a[href^="#s"]')].map(a=>[a.getAttribute('href').slice(1),a]));
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){links.forEach(a=>a.classList.remove('on'));const a=links.get(e.target.id);if(a)a.classList.add('on');}}),{rootMargin:'-80px 0px -70% 0px'});
  document.querySelectorAll('.doc h1[id],.doc h2[id]').forEach(h=>io.observe(h));
  $('#lo').onclick=e=>{e.preventDefault();gate();};
  $('#toc').hidden=false;$('#toc').onclick=()=>{$('aside').scrollTop=0;scrollTo({top:0,behavior:'smooth'});};
  scrollTo(0,0);
}

function rndPw(){
  const a='abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>a[x%a.length]).join('');
}

function editor(){
  $('#toc').hidden=true;
  app.innerHTML=`<header class="bar"><b>Management</b><nav><button data-t="h" class="on">Handbook</button><button data-t="p">Passwords</button><button data-t="g">Publishing</button></nav>
  <span id="st"></span><button id="pub">Publish update</button><button class="ghost" id="dl">Download copy</button><button class="ghost" id="lo">Lock</button></header><div id="pane"></div>`;
  const pane=$('#pane'),st=$('#st');
  const mark=()=>{dirty=true;st.textContent='Unsaved changes — download to publish';};
  const hb=()=>{
    pane.innerHTML=`<div class="ed"><textarea id="ta" spellcheck="false"></textarea><div class="doc" id="pv"></div></div>
    <p class="hint"># Part heading · ## Section · ### Subsection · "1) text" numbered point · two leading spaces = sub-point · "> text" = info box · **bold**</p>`;
    $('#ta').value=S.doc;$('#pv').innerHTML=md(S.doc).html;
    $('#ta').oninput=e=>{S.doc=e.target.value;$('#pv').innerHTML=md(S.doc).html;mark();};
  };
  const pw=()=>{
    pane.innerHTML=`<p class="hint">Staff passwords can read the handbook. Management codes can also open this editor. Each person/group can have their own, so you can revoke one without touching the rest.</p>
    ${S.pws.map((p,i)=>`<div class="row2"><input data-i="${i}" data-f="label" value="${esc(p.label)}" placeholder="Label"><input data-i="${i}" data-f="pw" value="${esc(p.pw)}" placeholder="Password">
    <select data-i="${i}" data-f="role"><option value="staff"${p.role==='staff'?' selected':''}>Staff (read only)</option><option value="mgmt"${p.role==='mgmt'?' selected':''}>Management (edit)</option></select>
    <button class="ghost" data-del="${i}">Delete</button></div>`).join('')}
    <button id="add">+ New password</button>`;
    $('#add').onclick=()=>{S.pws.push({id:Date.now()+'',label:'New password',pw:rndPw(),role:'staff'});mark();pw();};
  };
  const gp=()=>{
    const g=S.gh;
    pane.innerHTML=`<p class="hint">Connect a GitHub repository so "Publish update" updates the live site directly.</p>
    <div class="gh"><label>Repository (owner/name)<input data-g="repo" value="${esc(g.repo||'')}" placeholder="yourname/handbook"></label>
    <label>Branch<input data-g="branch" value="${esc(g.branch||'main')}"></label>
    <label>File path<input data-g="path" value="${esc(g.path||'index.html')}"></label>
    <label>Access token<input data-g="token" type="password" value="${esc(g.token||'')}"></label></div>
    <p class="hint">Setup: 1) Put this file in a GitHub repo as index.html and enable GitHub Pages. 2) In GitHub go to Settings, Developer settings, Fine-grained tokens, and create a token for that repo only with Contents: Read and write. 3) Paste it above. The token is stored encrypted and only management codes can read it.</p>`;
  };
  pane.oninput=e=>{const d=e.target.dataset;if(d.g){S.gh[d.g]=e.target.value;mark();return;}if(d.f&&d.i!==undefined){S.pws[d.i][d.f]=e.target.value;mark();}};
  pane.onclick=e=>{const i=e.target.dataset.del;if(i!==undefined&&confirm('Delete this password?')){S.pws.splice(i,1);mark();pw();}};
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x===b));
    ({h:hb,p:pw,g:gp})[b.dataset.t]();
  });
  $('#lo').onclick=()=>{if(!dirty||confirm('You have unsaved changes. Lock anyway?')){dirty=false;gate();}};
  async function makeHtml(){
    const p=S.pws;
    if(!p.some(x=>x.role==='mgmt'))return alert('You need at least one Management code.');
    if(p.some(x=>x.pw.length<6))return alert('Every password needs at least 6 characters.');
    if(new Set(p.map(x=>x.pw)).size<p.length)return alert('Passwords must be unique.');
    st.textContent='Encrypting…';
    const v=await build(S.doc,p,S.gh);
    const c=document.documentElement.cloneNode(true);
    c.querySelector('#app').innerHTML='';c.removeAttribute('data-theme');
    c.querySelector('#toc').setAttribute('hidden','');c.querySelector('#th').textContent='';
    c.querySelector('#vault').textContent=JSON.stringify(v);
    return '<!DOCTYPE html>\n'+c.outerHTML;
  }
  $('#dl').onclick=async()=>{
    const html=await makeHtml();if(!html){st.textContent='';return;}
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));
    a.download='index.html';a.click();
    dirty=false;st.textContent='Copy downloaded.';
  };
  $('#pub').onclick=async()=>{
    const g=S.gh;
    if(!g.repo||!g.token)return alert('Set up the Publishing tab first.');
    const html=await makeHtml();if(!html){st.textContent='';return;}
    const path=g.path||'index.html',br=g.branch||'main';
    const url=`https://api.github.com/repos/${g.repo}/contents/${path}`;
    const h={Authorization:'Bearer '+g.token,Accept:'application/vnd.github+json'};
    st.textContent='Publishing…';
    try{
      const q=await fetch(url+'?ref='+encodeURIComponent(br),{headers:h});
      if(!q.ok&&q.status!==404)throw new Error('GitHub '+q.status+' — check repository, branch and token');
      const body={message:'Update handbook',content:btoa(unescape(encodeURIComponent(html))),branch:br};
      if(q.ok)body.sha=(await q.json()).sha;
      const p=await fetch(url,{method:'PUT',headers:{...h,'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(!p.ok)throw new Error('GitHub '+p.status+': '+((await p.json()).message||''));
      dirty=false;st.textContent='Published. The live site updates within a minute or two.';
    }catch(x){st.textContent='';alert('Publish failed: '+x.message);}
  };
  hb();
}
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
const root=document.documentElement;
function setTheme(m,save){root.dataset.theme=m;$('#th').textContent=m==='dark'?'Light mode':'Dark mode';if(save)try{localStorage.setItem('theme',m)}catch(e){}}
let saved=null;try{saved=localStorage.getItem('theme')}catch(e){}
setTheme(saved==='dark'?'dark':'light');
$('#th').onclick=()=>setTheme(root.dataset.theme==='dark'?'light':'dark',true);
gate();
</script>
